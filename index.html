<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haress - Your orders, guarded.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c1322;
            --banner-bg: #1e293b;
            --card-bg: #151f32;
            --inner-box-bg: #182338;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-btn: rgba(255, 255, 255, 0.28);
            --gold: #d4a64a;
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .top-banner {
            background-color: var(--banner-bg);
            color: #cbd5e1;
            text-align: center;
            font-size: 13px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-subtle);
            line-height: 1.4;
        }

        .container {
            max-width: 440px;
            margin: 0 auto;
            padding: 36px 16px 48px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
        }

        /* إجبار الصورة على الظهور بألوانها وإضاءتها الطبيعية 100% */
        .hero img {
            width: 100%;
            max-width: 260px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            opacity: 1 !important;
            filter: none !important;
            mix-blend-mode: normal !important;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 24px 20px;
        }

        .section-label {
            color: var(--gold);
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .contact-block {
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .contact-block:last-child {
            padding-bottom: 0;
            margin-bottom: 0;
            border-bottom: none;
        }

        .field-label {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 6px;
        }

        .field-value {
            font-size: 18.5px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
            letter-spacing: 0.2px;
        }

        .field-value.hours {
            font-size: 16.5px;
            font-weight: 600;
            margin-bottom: 0;
        }

        .btn-outline {
            display: inline-block;
            background: transparent;
            color: #ffffff;
            border: 1px solid var(--border-btn);
            border-radius: 10px;
            padding: 10px 22px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #ffffff;
        }

        .social-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-box {
            display: block;
            text-decoration: none;
            background-color: var(--inner-box-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 16px 18px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .social-box:hover {
            border-color: rgba(212, 166, 74, 0.4);
            background-color: #1d2a42;
        }

        .social-name {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .social-handle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .order-desc {
            color: #e2e8f0;
            font-size: 15.5px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-solid {
            display: inline-block;
            background-color: #f1f5f9;
            color: #0c1322;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 13px 24px;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-solid:hover {
            background-color: #ffffff;
        }

        .steps-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .step-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f1f5f9;
            color: #0c1322;
            font-weight: 700;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .step-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .step-info p {
            font-size: 14.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .qa-list {
            display: flex;
            flex-direction: column;
        }

        .qa-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
        }

        .qa-item:first-child {
            padding-top: 4px;
        }

        .qa-item:last-child {
            padding-bottom: 4px;
            border-bottom: none;
        }

        .footer {
